<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অনলাইন এক্সাম জোন - AR Job Zone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Header Navigation -->
    <nav class="border-b border-slate-800 bg-slate-900/90 backdrop-blur fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="AR Job Zone Logo" class="h-12 w-auto object-contain rounded-lg">
                <span class="text-xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">AR Job Zone</span>
            </div>
            <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-300">
                <a href="index.html" class="hover:text-indigo-400 transition">হোম</a>
                <a href="courses.html" class="hover:text-indigo-400 transition">কোর্সসমূহ</a>
                <a href="exam.html" class="text-indigo-400 font-semibold">অনলাইন এক্সাম</a>
                <a href="register.html" class="hover:text-indigo-400 transition">রেজিস্ট্রেশন</a>
            </div>
            <a href="https://www.facebook.com/groups/566073545487101/about" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-5 py-2.5 rounded-xl transition">
                ফেসবুক গ্রুপ
            </a>
        </div>
    </nav>

    <!-- Quiz Section -->
    <section class="pt-32 pb-16 px-4 max-w-4xl mx-auto">
        <div class="bg-slate-800/80 border border-slate-700 p-8 rounded-3xl shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-400">📝 ডেইলি মডেল টেস্ট & কুইজ</h2>
                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30">ফ্রি মডেল টেস্ট</span>
            </div>
            
            <div class="space-y-6">
                <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-700/50">
                    <p class="text-lg font-medium text-slate-200 mb-4">প্রশ্ন ১: 'দারিদ্র্য' কবিতাটি কাজী নজরুল ইসলামের কোন কাব্যের অন্তর্ভুক্ত?</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="checkAnswer(this, false)" class="p-3 bg-slate-800 hover:bg-slate-700 text-left rounded-xl transition border border-slate-600">ক) অগ্নিবীণা</button>
                        <button onclick="checkAnswer(this, true)" class="p-3 bg-slate-800 hover:bg-slate-700 text-left rounded-xl transition border border-slate-600">খ) সিন্ধু-হিন্দোল</button>
                        <button onclick="checkAnswer(this, false)" class="p-3 bg-slate-800 hover:bg-slate-700 text-left rounded-xl transition border border-slate-600">গ) বিষের বাঁশী</button>
                        <button onclick="checkAnswer(this, false)" class="p-3 bg-slate-800 hover:bg-slate-700 text-left rounded-xl transition border border-slate-600">ঘ) চক্রবাক</button>
                    </div>
                    <div class="quiz-result mt-3 text-sm font-bold hidden"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        function checkAnswer(button, isCorrect) {
            const parent = button.closest('.bg-slate-900\\/60');
            const resultDiv = parent.querySelector('.quiz-result');
            resultDiv.classList.remove('hidden');
            if(isCorrect) {
                resultDiv.className = "quiz-result mt-3 text-sm font-bold text-emerald-400";
                resultDiv.innerText = "🎉 সঠিক উত্তর! (সিন্ধু-হিন্দোল)";
                button.classList.add('bg-emerald-600', 'text-white');
            } else {
                resultDiv.className = "quiz-result mt-3 text-sm font-bold text-red-400";
                resultDiv.innerText = "❌ ভুল উত্তর! সঠিক উত্তর: সিন্ধু-হিন্দোল";
                button.classList.add('bg-red-600', 'text-white');
            }
        }
    </script>
</body>
</html>
