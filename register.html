<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অনলাইন রেজিস্ট্রেশন - AR Job Zone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <nav class="border-b border-slate-800 bg-slate-900/90 backdrop-blur fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="AR Job Zone Logo" class="h-12 w-auto object-contain rounded-lg">
                <span class="text-xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">AR Job Zone</span>
            </div>
            <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-300">
                <a href="index.html" class="hover:text-indigo-400 transition">হোম</a>
                <a href="courses.html" class="hover:text-indigo-400 transition">কোর্সসমূহ</a>
                <a href="exam.html" class="hover:text-indigo-400 transition">অনলাইন এক্সাম</a>
                <a href="register.html" class="text-indigo-400 font-semibold">রেজিস্ট্রেশন</a>
            </div>
            <a href="https://www.facebook.com/groups/566073545487101/about" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-5 py-2.5 rounded-xl transition">
                ফেসবুক গ্রুপ
            </a>
        </div>
    </nav>

    <!-- Registration Section -->
    <section class="pt-32 pb-16 px-4 max-w-2xl mx-auto w-full">
        <div class="bg-slate-800/80 border border-slate-700 p-8 rounded-3xl shadow-2xl">
            <h2 class="text-3xl font-bold text-center text-indigo-400 mb-2">🎓 নতুন ব্যাচে ভর্তি ফর্ম</h2>
            <p class="text-slate-400 text-center text-sm mb-8">সঠিক তথ্য দিয়ে নিচের ফর্মটি পূরণ করুন।</p>

            <form id="student-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">আপনার পুরো নাম</label>
                    <input type="text" id="name" required placeholder="উদাহরণ: মো: আরিফুল ইসলাম" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">মোবাইল নম্বর</label>
                    <input type="tel" id="phone" required placeholder="017xxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">কাঙ্ক্ষিত কোর্স সিলেক্ট করুন</label>
                    <select id="course" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                        <option value="BCS Preliminary">BCS Preliminary Course</option>
                        <option value="Bank Job Master">Bank Job Master Course</option>
                        <option value="Primary Teacher Exam">Primary Teacher Exam Prep</option>
                        <option value="9th-20th Grade Special">9th-20th Grade Special Batch</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30">
                    ভর্তি ফর্ম সাবমিট করুন
                </button>
            </form>
            <div id="form-status" class="mt-4 text-center text-sm font-medium"></div>
        </div>
    </section>

    <!-- Firebase Script -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDJyF0nVDJ4y43as5U-ZESUyjRvH6x9hQ",
            authDomain: "coaching-7211a.firebaseapp.com",
            projectId: "coaching-7211a",
            storageBucket: "coaching-7211a.firebasestorage.app",
            messagingSenderId: "757734931061",
            appId: "1:757734931061:web:103ad840148c643d25963c",
            measurementId: "G-9SVRFWXZES"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const formStatus = document.getElementById('form-status');
            submitBtn.disabled = true;
            submitBtn.innerText = 'জমা হচ্ছে...';

            try {
                await db.collection('students').add({
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    course: document.getElementById('course').value,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                formStatus.className = "mt-4 text-center text-sm font-medium text-emerald-400";
                formStatus.innerText = "✅ ধন্যবাদ! আপনার ভর্তি আবেদন সফলভাবে ফায়ারবেসে জমা হয়েছে।";
                document.getElementById('student-form').reset();
            } catch (error) {
                formStatus.className = "mt-4 text-center text-sm font-medium text-red-400";
                formStatus.innerText = "❌ কোনো সমস্যা হয়েছে, আবার চেষ্টা করুন।";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ভর্তি ফর্ম সাবমিট করুন';
            }
        });
    </script>
</body>
</html>
